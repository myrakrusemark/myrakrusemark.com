<style>
  /* Post-local dressing. site.css owns .prose and .cs-fig; a note
     reads at a slightly larger measure than a case study, and its
     h1 is an article title, not the homepage poster. */
  .post h1 {
    font-weight: 300;
    font-size: clamp(2.1rem, 5vw, 3.25rem);
    letter-spacing: -0.01em;
    line-height: 1.08;
  }
  .post .dimline { max-width: 420px; }
  .post .prose { max-width: 70ch; }
  .post .prose p, .post .prose ul {
    font-size: 17.5px;
    line-height: 1.75;
  }
  /* bare links inside a note read like .plain-link */
  .post .prose a {
    color: var(--accent-deep);
    text-decoration: none;
    border-bottom: 1px solid rgba(200, 84, 61, 0.35);
    transition: border-color 0.15s var(--ease-snap), color 0.15s var(--ease-snap);
  }
  .post .prose a:hover { border-bottom-color: var(--accent); color: var(--ink); }
  /* inline code, if a note needs it */
  .post .prose code {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.86em;
    background: rgba(31, 33, 41, 0.05);
    border: 1px solid var(--border);
    padding: 1px 5px;
  }
  .post .prose pre {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    line-height: 1.6;
    background: rgba(31, 33, 41, 0.04);
    border: 1px solid var(--border);
    padding: 14px 16px;
    overflow-x: auto;
    margin: 0 0 16px;
  }
  .post .prose pre code { background: none; border: none; padding: 0; }
</style>
